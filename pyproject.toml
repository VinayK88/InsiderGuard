[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insiderguard"
version = "0.1.0"
description = "Explainable UEBA and data-exfiltration detection using peer baselines and event sequences."
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
insiderguard = "insiderguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
